name: CI for doordash

on:
  push:
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # This action clones the content of the current repo into the remote runner
      - name: Build Docker Image
        run: docker build -t app .
      - name: Run the container
        run:  |
          docker run -d \
          --name app \
          -p 8080:8090 \
          app
      - name: Wait for the app
        run: |
          timeout 60s bash -c '
            until curl -fsS http://localhost:8080/status; do
              echo "Waiting for app..."
              sleep 2
            done
          '
      - name: Test calculate fee
        run: |
          curl -fsS -X POST \
            http://localhost:8080/calculate-fee/ \
            -H "Content-Type: application/json" \
            -d '{"distance_km":10,"weight_kg":5}'
      - name: Test estimate time
        run: |
          curl -fsS -X GET \
            http://localhost:8080/estimate-time/ \
            -H "Content-Type: application/json"
